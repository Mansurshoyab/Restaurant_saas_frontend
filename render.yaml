services:
  - type: web
    name: restaurant-saas-frontend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_URL
        value: https://your-backend-url.onrender.com # Change this to your actual backend URL in the Render dashboard



